name: Continuous integration
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2
      - working-directory: ./docs
        run: cargo test --all

  format:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2
      - working-directory: ./docs
        run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2
      - working-directory: ./docs
        run: cargo clippy --all -- -D warnings